<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="80" ry="80" fill="#1a1a2e"/>
  
  <!-- Piano keys at the bottom -->
  <g transform="translate(56, 320)">
    <!-- White keys -->
    <rect x="0" y="0" width="50" height="140" rx="4" ry="4" fill="#f0f0f0" stroke="#999" stroke-width="1"/>
    <rect x="57" y="0" width="50" height="140" rx="4" ry="4" fill="#f0f0f0" stroke="#999" stroke-width="1"/>
    <rect x="114" y="0" width="50" height="140" rx="4" ry="4" fill="#f0f0f0" stroke="#999" stroke-width="1"/>
    <rect x="171" y="0" width="50" height="140" rx="4" ry="4" fill="#f0f0f0" stroke="#999" stroke-width="1"/>
    <rect x="228" y="0" width="50" height="140" rx="4" ry="4" fill="#f0f0f0" stroke="#999" stroke-width="1"/>
    <rect x="285" y="0" width="50" height="140" rx="4" ry="4" fill="#f0f0f0" stroke="#999" stroke-width="1"/>
    <rect x="342" y="0" width="50" height="140" rx="4" ry="4" fill="#f0f0f0" stroke="#999" stroke-width="1"/>
    <!-- Black keys -->
    <rect x="35" y="0" width="35" height="85" rx="3" ry="3" fill="#1a1a2e"/>
    <rect x="92" y="0" width="35" height="85" rx="3" ry="3" fill="#1a1a2e"/>
    <rect x="206" y="0" width="35" height="85" rx="3" ry="3" fill="#1a1a2e"/>
    <rect x="263" y="0" width="35" height="85" rx="3" ry="3" fill="#1a1a2e"/>
    <rect x="320" y="0" width="35" height="85" rx="3" ry="3" fill="#1a1a2e"/>
  </g>
  
  <!-- Music note -->
  <g transform="translate(170, 60)">
    <!-- Note stem -->
    <rect x="148" y="0" width="8" height="200" rx="4" ry="4" fill="#e94560"/>
    <!-- Note flag -->
    <path d="M156,0 C156,0 200,20 200,60 C200,100 156,80 156,80" fill="#e94560"/>
    <path d="M156,30 C156,30 195,50 195,85 C195,120 156,100 156,100" fill="#e94560"/>
    <!-- Note head -->
    <ellipse cx="135" cy="200" rx="40" ry="28" transform="rotate(-20, 135, 200)" fill="#e94560"/>
  </g>
  
  <!-- Subtle shine/glow on the note -->
  <g transform="translate(170, 60)" opacity="0.3">
    <ellipse cx="135" cy="200" rx="25" ry="16" transform="rotate(-20, 135, 200)" fill="#ff6b81"/>
  </g>
  
  <!-- Small decorative dots -->
  <circle cx="100" cy="140" r="6" fill="#e94560" opacity="0.4"/>
  <circle cx="420" cy="100" r="8" fill="#e94560" opacity="0.3"/>
  <circle cx="390" cy="200" r="5" fill="#e94560" opacity="0.5"/>
  <circle cx="130" cy="250" r="4" fill="#e94560" opacity="0.35"/>
</svg>
